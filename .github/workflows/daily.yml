name: daily-tarot

on:
  schedule:
    - cron: "45 5 * * 0-5"
    - cron: "10 6 * * 0-5"
    - cron: "35 6 * * 0-5"
  workflow_dispatch:
    inputs:
      args:
        description: "--test / --weekly / --force"
        required: false
        default: ""

permissions:
  contents: write

concurrency: daily-tarot

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py ${{ github.event.inputs.args }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
      - name: Save state
        run: |
          [ -f data/state.json ] || exit 0
          git config user.name "tarot-bot"
          git config user.email "tarot-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%F)" && git push)
